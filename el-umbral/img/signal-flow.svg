<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">El Umbral signal flow</title>
  <desc id="d">Depth camera reads the body as a silhouette. Pose data enters TouchDesigner. Generative AI and real-time graphics drive the projection wall. Show control keeps the cycle running.</desc>
  <rect width="1200" height="640" fill="#F5F5F7"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#111"/>
    </marker>
    <style>
      .lab{ font-family: Inter, ui-sans-serif, system-ui, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <text class="lab" x="48" y="52" font-size="22" font-weight="700" fill="#111" letter-spacing="-0.4">Signal flow</text>
  <text class="lab" x="48" y="78" font-size="14" fill="#6E6E73">Camera ’ body ’ engine ’ wall. No facial recognition.</text>

  <!-- 01 Camera -->
  <g transform="translate(48,140)">
    <rect width="200" height="280" rx="20" fill="#fff" stroke="#E5E5EA"/>
    <text class="lab" x="100" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#6E6E73" letter-spacing="2">01</text>
    <g transform="translate(58,70)" fill="none" stroke="#111" stroke-width="2.4" stroke-linejoin="round">
      <rect x="8" y="18" width="76" height="48" rx="8"/>
      <circle cx="46" cy="42" r="14"/>
      <circle cx="46" cy="42" r="6" fill="#111" stroke="none"/>
      <path d="M28 18 L34 8 H58 L64 18"/>
      <path d="M18 78 H74" stroke-linecap="round"/>
    </g>
    <text class="lab" x="100" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#111">Depth camera</text>
    <text class="lab" x="100" y="194" text-anchor="middle" font-size="13" fill="#6E6E73">Pose · motion</text>
    <text class="lab" x="100" y="214" text-anchor="middle" font-size="13" fill="#6E6E73">Silhouette only</text>
  </g>

  <line x1="258" y1="280" x2="318" y2="280" stroke="#111" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 02 Body -->
  <g transform="translate(328,140)">
    <rect width="200" height="280" rx="20" fill="#fff" stroke="#E5E5EA"/>
    <text class="lab" x="100" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#6E6E73" letter-spacing="2">02</text>
    <g transform="translate(74,62)" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="14" r="10"/>
      <path d="M26 26 V58"/>
      <path d="M8 38 L26 32 L44 38"/>
      <path d="M12 96 L26 58 L40 96"/>
    </g>
    <text class="lab" x="100" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#111">Body tracking</text>
    <text class="lab" x="100" y="194" text-anchor="middle" font-size="13" fill="#6E6E73">How many bodies</text>
    <text class="lab" x="100" y="214" text-anchor="middle" font-size="13" fill="#6E6E73">No face ID</text>
  </g>

  <line x1="538" y1="280" x2="598" y2="280" stroke="#111" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 03 Engine -->
  <g transform="translate(608,140)">
    <rect width="200" height="280" rx="20" fill="#fff" stroke="#E5E5EA"/>
    <text class="lab" x="100" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#6E6E73" letter-spacing="2">03</text>
    <g transform="translate(52,68)" fill="none" stroke="#111" stroke-width="2.2">
      <rect x="0" y="8" width="36" height="24" rx="4"/>
      <rect x="58" y="0" width="36" height="24" rx="4"/>
      <rect x="29" y="52" width="36" height="24" rx="4"/>
      <path d="M36 20 H58 M18 32 V52 M76 24 V52 M47 52"/>
      <line x1="18" y1="32" x2="47" y2="52"/>
      <line x1="76" y1="24" x2="47" y2="52"/>
    </g>
    <text class="lab" x="100" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#111">TouchDesigner</text>
    <text class="lab" x="100" y="194" text-anchor="middle" font-size="13" fill="#6E6E73">Live mapping</text>
    <text class="lab" x="100" y="214" text-anchor="middle" font-size="13" fill="#6E6E73">Never waits a render</text>
  </g>

  <line x1="818" y1="280" x2="878" y2="280" stroke="#111" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 04 Wall -->
  <g transform="translate(888,140)">
    <rect width="264" height="280" rx="20" fill="#fff" stroke="#E5E5EA"/>
    <text class="lab" x="132" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#6E6E73" letter-spacing="2">04</text>
    <g transform="translate(72,58)">
      <rect x="0" y="8" width="120" height="72" rx="6" fill="#111"/>
      <circle cx="36" cy="40" r="10" fill="#3CDCFF"/>
      <circle cx="62" cy="34" r="6" fill="#FF2E8A"/>
      <circle cx="88" cy="46" r="8" fill="#FF8A3C"/>
      <path d="M18 88 L60 80 L102 88" fill="none" stroke="#111" stroke-width="2.2"/>
    </g>
    <text class="lab" x="132" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#111">Generative AI wall</text>
    <text class="lab" x="132" y="194" text-anchor="middle" font-size="13" fill="#6E6E73">Projection · 6.5 m</text>
    <text class="lab" x="132" y="214" text-anchor="middle" font-size="13" fill="#6E6E73">Visitor is the image</text>
  </g>

  <!-- show control bar -->
  <rect x="48" y="460" width="1104" height="128" rx="20" fill="#fff" stroke="#E5E5EA"/>
  <text class="lab" x="80" y="508" font-size="13" font-weight="700" fill="#6E6E73" letter-spacing="1.6">SHOW CONTROL</text>
  <text class="lab" x="80" y="536" font-size="16" font-weight="700" fill="#111">Wait ’ Start ’ Interact ’ Close</text>
  <text class="lab" x="80" y="560" font-size="13" fill="#6E6E73">If the sensor drops, the picture does not go black. Content can swap for another event.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">El Umbral system architecture</title>
  <desc id="d">Inputs, real-time engine and output mapping for the interactive AI wall.</desc>
  <rect width="1200" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.4 L9 5 L0 8.6 Z" fill="#FF8A3C"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.4 L9 5 L0 8.6 Z" fill="#3CDCFF"/>
    </marker>
    <style>
      .lab{ font-family: Inter, ui-sans-serif, system-ui, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- INPUTS -->
  <g transform="translate(40,40)">
    <rect width="280" height="480" rx="8" fill="none" stroke="#111" stroke-width="2"/>
    <text class="lab" x="140" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#111" letter-spacing="1.2">INPUTS</text>
    <rect x="24" y="64" width="232" height="88" rx="6" fill="none" stroke="#111" stroke-width="1.6"/>
    <text class="lab" x="140" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#111">DEPTH CAMERA</text>
    <text class="lab" x="140" y="124" text-anchor="middle" font-size="13" fill="#6E6E73">Azure / RealSense class</text>
    <rect x="24" y="172" width="232" height="88" rx="6" fill="none" stroke="#111" stroke-width="1.6"/>
    <text class="lab" x="140" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#111">BODY TRACKING</text>
    <text class="lab" x="140" y="232" text-anchor="middle" font-size="13" fill="#6E6E73">Silhouette · pose · count</text>
    <rect x="24" y="280" width="232" height="88" rx="6" fill="none" stroke="#111" stroke-width="1.6"/>
    <text class="lab" x="140" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#111">NO FACE ID</text>
    <text class="lab" x="140" y="340" text-anchor="middle" font-size="13" fill="#6E6E73">Body is enough</text>
    <rect x="24" y="388" width="232" height="64" rx="6" fill="none" stroke="#111" stroke-width="1.6"/>
    <text class="lab" x="140" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#111">FALLBACK LOOP</text>
  </g>

  <!-- ENGINE -->
  <g transform="translate(460,40)">
    <rect width="280" height="300" rx="8" fill="none" stroke="#111" stroke-width="2"/>
    <text class="lab" x="140" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#111" letter-spacing="1.2">REAL-TIME ENGINE</text>
    <rect x="24" y="64" width="232" height="96" rx="6" fill="none" stroke="#111" stroke-width="1.6"/>
    <text class="lab" x="140" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#111">TouchDesigner</text>
    <text class="lab" x="140" y="126" text-anchor="middle" font-size="13" fill="#6E6E73">Pose ’ parameters ’ COMP</text>
    <rect x="24" y="180" width="232" height="96" rx="6" fill="none" stroke="#111" stroke-width="1.6"/>
    <text class="lab" x="140" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Generative AI</text>
    <text class="lab" x="140" y="242" text-anchor="middle" font-size="13" fill="#6E6E73">Live image on the same engine</text>
  </g>

  <g transform="translate(460,360)">
    <rect width="280" height="160" rx="8" fill="none" stroke="#111" stroke-width="2"/>
    <text class="lab" x="140" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#111" letter-spacing="1.2">SHOW CONTROL</text>
    <text class="lab" x="140" y="78" text-anchor="middle" font-size="14" fill="#111">Wait · Start · Interact · Close</text>
    <text class="lab" x="140" y="104" text-anchor="middle" font-size="13" fill="#6E6E73">Night cycle for a mall queue</text>
    <text class="lab" x="140" y="128" text-anchor="middle" font-size="13" fill="#6E6E73">Content swap without rebuild</text>
  </g>

  <!-- OUTPUT -->
  <g transform="translate(880,40)">
    <rect width="280" height="480" rx="8" fill="none" stroke="#111" stroke-width="2"/>
    <text class="lab" x="140" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#111" letter-spacing="1.2">OUTPUT</text>
    <rect x="24" y="64" width="232" height="380" rx="6" fill="none" stroke="#111" stroke-width="1.6"/>
    <text class="lab" x="140" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Projection wall</text>
    <text class="lab" x="140" y="168" text-anchor="middle" font-size="13" fill="#6E6E73">6.5 m surface</text>
    <text class="lab" x="140" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Particles / 3D / AI figure</text>
    <text class="lab" x="140" y="248" text-anchor="middle" font-size="13" fill="#6E6E73">Mapped live to the body</text>
    <text class="lab" x="140" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Visitor as image</text>
    <text class="lab" x="140" y="328" text-anchor="middle" font-size="13" fill="#6E6E73">The room is the controller</text>
  </g>

  <!-- connectors -->
  <path d="M320 168 H448" fill="none" stroke="#FF8A3C" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M320 276 H448" fill="none" stroke="#FF8A3C" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M740 190 H868" fill="none" stroke="#3CDCFF" stroke-width="2.2" marker-end="url(#b)"/>
  <path d="M740 240 H868" fill="none" stroke="#3CDCFF" stroke-width="2.2" marker-end="url(#b)"/>
  <path d="M740 430 H868" fill="none" stroke="#3CDCFF" stroke-width="2.2" marker-end="url(#b)"/>
</svg>
